[project]
name = "haven"
version = "0.1.0"
description = "HAVEN world-state service: building graph, cascade engine, agents, and realtime broadcast"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "networkx>=3.7",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
